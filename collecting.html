<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=100%, initial-scale=.4">
        <title>Collecting</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <script type="module" src="neotcg/neotcg.js"></script>
    </head>
    <body>

        <div id="main">

            <div class="flex fcol center">
                <p>High Priority</p>
                <div>
                    <span class="neotcg" data-name="deckgridowned" data-input="artists"></span>
                    <span class="neotcg" data-name="deckgridownedwmaster" data-input="artists"></span>
                </div>
            </div>
            
            <br>

            <div class="flex fcol center">
                <p>All Needed Decks</p>
                <span class="neotcg" data-name="neededdeckscoloreddivs"></span>
                <span class="neotcg" data-name="neededdeckstextarea"></span>
            </div>

            <br>

            <div class="flex fcol center">
                <p>All Needed Single Cards</p>
                <span class="neotcg" data-name="neededsinglecardstext"></span>
                <span class="neotcg" data-name="neededsinglecardstextarea"></span>
            </div>

            <br>

            <div class="flex fcol center">
                <p>All Card Needs</p>
                <span class="neotcg" data-name="neededcardstextarea"></span>
            </div>

        </div>

    </body>
</html>
